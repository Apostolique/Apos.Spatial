name: Build documentation

on:
  push:
    branches:
    - 'main'
    paths:
    - 'docs/**'
    - 'README.md'
    - 'CHANGELOG.md'
    - '.github/workflows/documentation.yml'
  workflow_dispatch:

env:
  TITLE: Apos.Spatial
  DESCRIPTION: Spatial partitioning library for MonoGame.
  BASE: Apos.Spatial
  REPO: https://github.com/Apostolique/Apos.Spatial/tree/main/
  URL: https://apostolique.github.io/Apos.Spatial/
  ANALYTICS: G-564PSPW6KL

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
    - name: Install apos-docs
      run: npm install apos-docs@^0.7.0 -g
    - name: Use apos-docs
      run: |
        apos-docs -t ${{ env.TITLE }} -d '${{ env.DESCRIPTION }}' -b ${{ env.BASE }} -r ${{ env.REPO }} -a ${{ env.ANALYTICS }} -u ${{ env.URL }}
        cd apos-docs
        npm ci
        npm run build
        cd -
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./apos-docs/_site
